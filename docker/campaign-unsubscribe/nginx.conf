# ExportControl V7 — gateway publico APENAS para descadastro.
# Nao abrir portas do host. O ngrok deve apontar para este serviço, nunca para laravel.test.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;  # URLs contêm tokens HMAC; não registrar no log de acesso.
    client_max_body_size 8k;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @generic_service_error;
    error_page 400 403 404 419 = @generic_not_found;

    location @generic_not_found {
        internal;
        default_type text/plain;
        return 404 "Link indisponível ou inválido.\n";
    }

    location @generic_service_error {
        internal;
        default_type text/plain;
        return 503 "Serviço temporariamente indisponível. Tente novamente mais tarde.\n";
    }

    # RESTRICAO INTENCIONAL: HMAC do UnsubscribeToken.php: <id>.<64 caracteres hex>.
    # Um path /dashboard, /up, /api ou /webhooks jamais pode passar deste gateway.
    location ~ "^/email/descadastro/[1-9][0-9]{0,18}\.[a-f0-9]{64}$" {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        proxy_http_version 1.1;
        proxy_pass http://laravel.test:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_cookie_flags ~.* secure httponly samesite=lax;
        proxy_connect_timeout 4s;
        proxy_send_timeout 12s;
        proxy_read_timeout 15s;
    }

    location / { return 404; }
}
