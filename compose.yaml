x-logging: &default-logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '5'

services:
    laravel.test:
        logging: *default-logging
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:${APP_PORT:-80}:80'
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
        healthcheck:
            test:
                - CMD
                - php
                - -r
                - '$$context = stream_context_create(["http" => ["ignore_errors" => true, "timeout" => 2]]); file_get_contents("http://127.0.0.1/up", false, $$context); exit(isset($$http_response_header[0]) && str_contains($$http_response_header[0], " 200 ") ? 0 : 1);'
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
    receita-data:
        logging: *default-logging
        build:
            context: ./tools/receita
            dockerfile: Dockerfile
        ports:
            - '127.0.0.1:${FORWARD_RECEITA_DATA_PORT:-8091}:8000'
        environment:
            RECEITA_DATA_DIR: '${RECEITA_DATA_DIR:-/real-data/processed/active}'
            RFB_WEBDAV_BASE: '${RFB_WEBDAV_BASE:-https://arquivos.receitafederal.gov.br/public.php/webdav}'
            RFB_CNPJ_PATH: '${RFB_CNPJ_PATH:-Dados/Cadastros/CNPJ}'
            RFB_SHARE_TOKEN: '${RFB_SHARE_TOKEN:-}'
        volumes:
            - './tools/receita:/app'
            - './tools/receita/fixtures:/data:ro'
            - './tools/receita/data:/real-data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    queue-worker:
        logging: *default-logging
        profiles:
            - background
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --sleep=1
            - --tries=4
            - --timeout=600
            - --max-time=3600
        stop_grace_period: 11m
        restart: unless-stopped

    hubspot-webhook-worker:
        logging: *default-logging
        profiles:
            - background
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=hubspot-webhooks
            - --sleep=1
            - --tries=5
            - --timeout=180
            - --max-time=3600
        stop_grace_period: 4m
        restart: unless-stopped

    hubspot-realtime-worker:
        logging: *default-logging
        profiles:
            - background
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=hubspot-realtime
            - --sleep=1
            - --tries=4
            - --timeout=600
            - --max-time=3600
        stop_grace_period: 11m
        restart: unless-stopped

    hubspot-bulk-worker:
        logging: *default-logging
        profiles:
            - background
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=hubspot-bulk
            - --sleep=1
            - --tries=4
            - --timeout=600
            - --max-time=3600
        stop_grace_period: 11m
        restart: unless-stopped

    campaigns-worker:
        logging: *default-logging
        profiles:
            - background
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - php
            - artisan
            - queue:work
            - redis
            - '--queue=${CAMPAIGN_MAIL_QUEUE:-campaigns}'
            - --sleep=2
            - --tries=1
            - --timeout=120
            - --max-time=3600
        stop_grace_period: 3m
        restart: unless-stopped

    scheduler:
        logging: *default-logging
        profiles:
            - background
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - php
            - artisan
            - schedule:work
        stop_grace_period: 11m
        restart: unless-stopped

    # EC_CAMPAIGNS_V7_GATEWAY: somente a rota publica de descadastro.
    # Sem "ports": acessivel apenas aos containers na rede sail.
    campaigns-unsubscribe-gateway:
        logging: *default-logging
        profiles:
            - background
        image: nginx:1.27-alpine
        volumes:
            - './docker/campaign-unsubscribe/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - nginx -t && kill -0 1
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: unless-stopped

    ngrok:
        logging: *default-logging
        profiles:
            - background
        image: ngrok/ngrok:latest
        environment:
            NGROK_AUTHTOKEN: '${NGROK_AUTHTOKEN}'
        command:
            - http
            - campaigns-unsubscribe-gateway:8080
            - --url
            - 'https://${NGROK_DOMAIN}'
        networks:
            - sail
        depends_on:
            campaigns-unsubscribe-gateway:
                condition: service_healthy
        restart: unless-stopped

    pgsql:
        logging: *default-logging
        image: 'postgres:18-alpine'
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-laravel}'
            POSTGRES_USER: '${DB_USERNAME:-root}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-laravel}'
                - '-U'
                - '${DB_USERNAME:-root}'
            interval: 10s
            retries: 3
            timeout: 5s
            start_period: 10s
    redis:
        logging: *default-logging
        image: 'redis:alpine'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            retries: 3
            timeout: 5s
            start_period: 5s
    mailpit:
        logging: *default-logging
        image: 'axllent/mailpit:latest'
        ports:
            - '127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
